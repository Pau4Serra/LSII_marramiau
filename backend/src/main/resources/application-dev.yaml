server:
  port: 8080

pro_tube:
  load_initial_data: true
  auth:
    success-url: ${ENV_PROTUBE_FRONTEND_URL:http://localhost:5173/}

spring:
  flyway:
    enabled: false
  datasource:
    url: "jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 5
  sql:
    init:
      platform: h2
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
