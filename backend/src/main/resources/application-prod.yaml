server:
  port: 8090

spring:
  datasource:
    url: "jdbc:postgresql://${ENV_PROTUBE_DB_HOST}:5432/${ENV_PROTUBE_DB}"
    username: "${ENV_PROTUBE_DB_USER}"
    password: "${ENV_PROTUBE_DB_PASS}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.web: DEBUG
