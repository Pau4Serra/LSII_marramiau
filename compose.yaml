services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-root}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS:-pwd}
      POSTGRES_DB: ${ENV_PROTUBE_DB:-protube_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30

  # Only Compose enables the frontend build; local Spring profiles are backend-only.
  backend:
    image: maven:3.9-amazoncorretto-21
    working_dir: /app/backend
    command: [mvn, "-Pprod,frontend", -DbuildDirectory=/build/target, clean, spring-boot:run]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB:-protube_db}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER:-root}
      ENV_PROTUBE_DB_PASS: ${ENV_PROTUBE_DB_PASS:-pwd}
      ENV_PROTUBE_GOOGLE_CLIENT_ID: ${ENV_PROTUBE_GOOGLE_CLIENT_ID:-}
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: ${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:-}
      ENV_PROTUBE_FRONTEND_URL: /
      VITE_API_DOMAIN: ""
      VITE_MEDIA_DOMAIN: ""
      ENV_PROTUBE_MEDIA_MODE: ${ENV_PROTUBE_MEDIA_MODE:-local}
      ENV_PROTUBE_MEDIA_BASE_URL: ${ENV_PROTUBE_MEDIA_BASE_URL:-https://marramiau-protube.duckdns.org}
      ENV_PROTUBE_MEDIA_API_KEY: ${ENV_PROTUBE_MEDIA_API_KEY:-}
      ENV_PROTUBE_STORE_DIR: /media-store
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - .:/app
      - backend_target:/build
      - frontend_node_modules:/app/frontend/node_modules
      - maven_repo:/root/.m2
      - ${ENV_PROTUBE_STORE_DIR:-./store}:/media-store

volumes:
  postgres_data:
  backend_target:
  frontend_node_modules:
  maven_repo:
